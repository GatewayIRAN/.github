name: 📚 Documentation problem
description: Something is missing, wrong, or misleading in the docs
title: "docs: "
labels: ["type:docs", "status:triage"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: File path, URL, or `--help` output
      placeholder: README.md — "Renewal" section
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong with it?
      description: |
        "Unclear" is a valid answer — say which sentence stopped you and what
        you expected it to mean.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
    validations:
      required: false
