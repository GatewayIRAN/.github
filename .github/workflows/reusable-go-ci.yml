# Shared CI for every Go project in this account.
# Callers only need:
#   jobs:
#     ci:
#       uses: GatewayIRAN/.github/.github/workflows/reusable-go-ci.yml@main
name: Reusable Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go toolchain. Leave empty to take it from go.mod.
        type: string
        default: ""
      coverage-threshold:
        description: Fail if statement coverage drops below this percentage.
        type: number
        default: 0

permissions:
  contents: read

jobs:
  vet:
    name: format · vet · tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go.mod is tidy
        run: |
          cp go.mod go.mod.orig
          go mod tidy
          if ! diff -q go.mod go.mod.orig; then
            echo "::error::go.mod is not tidy - run 'go mod tidy'"
            diff -u go.mod.orig go.mod || true
            exit 1
          fi
          rm go.mod.orig

  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: coverage floor
        if: matrix.os == 'ubuntu-latest' && inputs.coverage-threshold > 0
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "statement coverage: ${pct}%"
          floor=${{ inputs.coverage-threshold }}
          awk -v p="$pct" -v t="$floor" 'BEGIN {
            if (p+0 < t+0) {
              printf "::error::coverage %.1f%% is below the %.1f%% floor\n", p, t
              exit 1
            }
          }'

  build:
    name: build · ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: cross compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" ./...
