# Shared release pipeline: cross-compiled binaries built reproducibly, a
# SHA256 manifest, and a signed build-provenance attestation.
name: Reusable Release

on:
  workflow_call:
    inputs:
      binary-name:
        type: string
        required: true
      main-package:
        description: Package path of the entrypoint.
        type: string
        default: "./cmd"
      version:
        description: Version stamped into the binary, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  artifacts:
    name: build · attest · publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release, upload assets
      id-token: write      # provenance signing
      attestations: write  # provenance attestation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: build every target
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
          BIN: ${{ inputs.binary-name }}
          PKG: ${{ inputs.main-package }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # timestamp taken from the tagged commit, so the build is reproducible
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          commit="$(git rev-parse HEAD)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            out="dist/${BIN}_${VERSION}_${goos}_${goarch}${ext}"
            echo "building $out"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -buildvcs=false \
              -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${commit} -X main.buildEpoch=${SOURCE_DATE_EPOCH}" \
              -o "$out" "$PKG"
          done
          cd dist
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: attest build provenance
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.binary-name }}-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag \
              $prerelease
          fi
