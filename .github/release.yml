changelog:
  exclude:
    labels: [ignore-for-release]
    authors: [dependabot]
  categories:
    - title: 🚨 Breaking changes
      labels: [breaking-change]
    - title: 🚀 Features
      labels: [type:feature, enhancement]
    - title: 🐛 Fixes
      labels: [type:bug]
    - title: 🔐 Security
      labels: [type:security]
    - title: ⚡ Performance
      labels: [type:perf]
    - title: 📚 Documentation
      labels: [type:docs]
    - title: 🧹 Maintenance
      labels: ["*"]
